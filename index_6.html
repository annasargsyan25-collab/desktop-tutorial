  --dot:oklch(94% 0.01 45 / 5%); --cover-ghost:oklch(24% 0.01 45);
}
.theme-light {
  --bg:oklch(97% 0.008 75); --card:oklch(100% 0 0); --card-border:oklch(85% 0.01 60);
  --text:oklch(22% 0.015 45); --muted:oklch(46% 0.02 45);

.daran { font-family:'Sora',sans-serif; background-color:var(--bg); background-image:radial-gradient(var(--dot) 1px, transparent 1px); background-size:24px 24px; color:var(--text); min-height:100vh; transition:background-color 200ms ease-out, color 200ms ease-out; }
.daran * { box-sizing:border-box; }
.serif { font-family:'Literata',serif; }
.muted { color:var(--muted); }
.card { background:var(--card); border:1px solid var(--card-border); border-radius:16px; }
.apricot { color:var(--apricot); }
.apricot-bg { background:var(--apricot-solid); }
.moss-bg { background:var(--moss-bg); }
.moss-text { color:var(--moss-text); }
.btn { font-family:'Sora',sans-serif; border:none; cursor:pointer; transition:transform 160ms ease-out, background 160ms ease-out, filter 160ms ease-out; color:var(--text); }
.btn:active { transform:scale(0.97); }
.btn-primary { background:var(--apricot-solid); color:var(--apricot-ink); font-weight:600; }
.btn-primary:hover { filter:brightness(1.08); }
.btn-primary:disabled { opacity:0.4; cursor:not-allowed; }
.btn-ghost { background:var(--ghost-bg); color:var(--text); }
.btn-ghost:hover { background:var(--ghost-bg-hover); }
.input, select.input { font-family:'Sora',sans-serif; font-size:16px; background:var(--input-bg); border:1px solid var(--input-border); color:var(--text); border-radius:10px; padding:11px 14px; width:100%; transition:border-color 160ms ease-out, box-shadow 160ms ease-out; }
.input::placeholder { color:var(--input-placeholder); }
.input:focus-visible, .btn:focus-visible, .chip:focus-visible, .avatar-btn:focus-visible, .icon-btn:focus-visible, .lang-select:focus-visible { outline:none; box-shadow:0 0 0 2px var(--apricot-solid); }
.chip { font-family:'Sora',sans-serif; font-size:13px; padding:7px 14px; border-radius:999px; border:1px solid var(--input-border); background:transparent; color:var(--chip-text); cursor:pointer; transition:all 160ms ease-out; white-space:nowrap; }
.chip:active { transform:scale(0.97); }
.chip.active { background:var(--apricot-solid); color:var(--apricot-ink); border-color:transparent; font-weight:600; }
.icon-btn { display:flex; align-items:center; justify-content:center; background:none; border:none; cursor:pointer; color:inherit; transition:transform 160ms ease-out, background 160ms ease-out; }
.icon-btn:active { transform:scale(0.94); }
.lang-select { font-family:'Sora',sans-serif; font-size:12px; font-weight:700; background:var(--ghost-bg); border:1px solid var(--input-border); color:var(--text); border-radius:8px; padding:7px 6px; cursor:pointer; }
@media (hover:hover) and (pointer:fine) {
  .chip:not(.active):hover { border-color:var(--apricot-solid); color:var(--text); }
  .book-card:hover { transform:translateY(-3px); border-color:color-mix(in oklch, var(--apricot-solid) 40%, transparent); }
  .avatar-btn:hover { transform:scale(1.05); }
  .icon-btn:hover { background:var(--ghost-bg); }
  .fab:hover { filter:brightness(1.08); }
}
.book-card { transition:transform 200ms cubic-bezier(0.23,1,0.32,1), border-color 200ms ease-out; cursor:pointer; }
.avatar-btn { border:2px solid transparent; border-radius:999px; padding:0; cursor:pointer; transition:transform 160ms ease-out, border-color 160ms ease-out; background:none; }
.avatar-btn:active { transform:scale(0.95); }
.avatar-btn.selected { border-color:var(--apricot-solid); }
.checkbox-row { display:flex; align-items:center; gap:10px; padding:12px 14px; border-radius:10px; border:1px solid var(--input-border); cursor:pointer; transition:border-color 160ms ease-out, background 160ms ease-out; }
.checkbox-row.checked { border-color:var(--apricot-solid); background:color-mix(in oklch, var(--apricot-solid) 10%, transparent); }
.box { width:20px; height:20px; border-radius:6px; border:1.5px solid var(--box-border); display:flex; align-items:center; justify-content:center; flex-shrink:0; transition:background 160ms ease-out, border-color 160ms ease-out; }
.checkbox-row.checked .box { background:var(--apricot-solid); border-color:var(--apricot-solid); }
.fadein { animation:fadein 300ms cubic-bezier(0.23,1,0.32,1); }
@keyframes fadein { from { opacity:0; transform:translateY(6px); } to { opacity:1; transform:translateY(0); } }
.toast { animation:toastin 240ms cubic-bezier(0.23,1,0.32,1); }
@keyframes toastin { from { opacity:0; transform:scale(0.95); } to { opacity:1; transform:scale(1); } }
.progress-track { height:4px; background:var(--track); border-radius:999px; overflow:hidden; }
.progress-fill { height:100%; background:var(--apricot-solid); transition:width 300ms cubic-bezier(0.23,1,0.32,1); }

.fab { position:fixed; bottom:calc(20px + env(safe-area-inset-bottom)); right:calc(20px + env(safe-area-inset-right)); width:56px; height:56px; border-radius:999px; display:flex; align-items:center; justify-content:center; box-shadow:0 8px 24px rgba(0,0,0,0.45); z-index:9999; border:none; cursor:pointer; transition:transform 160ms ease-out, filter 160ms ease-out; }
.fab:active { transform:scale(0.93); }
.chat-panel { position:fixed; bottom:calc(88px + env(safe-area-inset-bottom)); right:calc(20px + env(safe-area-inset-right)); width:340px; max-width:calc(100vw - 32px); height:460px; max-height:calc(100vh - 150px); z-index:9998; display:flex; flex-direction:column; overflow:hidden; transform-origin:bottom right; animation:chatpop 220ms cubic-bezier(0.23,1,0.32,1); }
@keyframes chatpop { from { opacity:0; transform:scale(0.92) translateY(6px); } to { opacity:1; transform:scale(1) translateY(0); } }
.msg { max-width:82%; padding:9px 13px; border-radius:14px; font-size:13.5px; line-height:1.45; }
.msg.bot { background:var(--ghost-bg); align-self:flex-start; border-bottom-left-radius:4px; }
.msg.user { background:var(--apricot-solid); color:var(--apricot-ink); align-self:flex-end; border-bottom-right-radius:4px; font-weight:500; }
.typing-dot { width:5px; height:5px; border-radius:50%; background:var(--muted); display:inline-block; animation:blink 1.1s infinite; }
.typing-dot:nth-child(2){ animation-delay:0.15s; } .typing-dot:nth-child(3){ animation-delay:0.3s; }
@keyframes blink { 0%,80%,100%{opacity:0.25;} 40%{opacity:1;} }

@media (prefers-reduced-motion:reduce) {

function answerFor(text, lang) {
  const t = text.toLowerCase();
  const faq = T[lang].faq;
  const hit = faq.find(f => f.kws.some(k => t.includes(k)));
  return hit ? hit.a : T[lang].fallback;
}

function ChatWidget({ lang, t }) {
  const [open,setOpen] = useState(false);
  const [messages,setMessages] = useState([{ id:nextId(), from:'bot', text:t.greeting }]);
  const [draft,setDraft] = useState('');
  const [typing,setTyping] = useState(false);
  const listRef = useRef(null);
  const inputRef = useRef(null);

  useEffect(() => { setMessages(m => [{ id:nextId(), from:'bot', text:t.greeting }, ...m.slice(1)]); }, [lang]);
  useEffect(() => { if(open && inputRef.current) inputRef.current.focus(); }, [open]);
  useEffect(() => { if(listRef.current) listRef.current.scrollTop = listRef.current.scrollHeight; }, [messages, typing]);

  const send = (text) => {
    const clean = text.trim();
    if (!clean) return;
    setMessages(m => [...m, { id:nextId(), from:'user', text:clean }]);
    setDraft('');
    setTyping(true);
    setTimeout(() => {
      setTyping(false);
      setMessages(m => [...m, { id:nextId(), from:'bot', text:answerFor(clean, lang) }]);
    }, 550);
  };

  return (
    <>
      <button className="fab apricot-bg icon-btn" onClick={()=>setOpen(o=>!o)} aria-label={open?t.closeChat:t.openChat} aria-expanded={open}>
        {open ? <XIcon size={22} color="var(--apricot-ink)"/> : <MessageIcon size={22} color="var(--apricot-ink)"/>}
      </button>
      {open && (
        <div className="card chat-panel" role="dialog" aria-label={BOT_NAME}>
          <div style={{padding:'14px 16px',borderBottom:'1px solid var(--divider)',display:'flex',alignItems:'center',gap:10}}>
            <div className="apricot-bg" style={{width:28,height:28,borderRadius:8,display:'flex',alignItems:'center',justifyContent:'center',flexShrink:0}}><MessageIcon size={15} color="var(--apricot-ink)"/></div>
            <div><div style={{fontWeight:600,fontSize:14}}>{BOT_NAME}</div><div className="muted" style={{fontSize:11}}>{t.chatSubtitle}</div></div>
          </div>
          <div ref={listRef} aria-live="polite" style={{flex:1,overflowY:'auto',padding:14,display:'flex',flexDirection:'column',gap:8}}>
            {messages.map(m => <div key={m.id} className={`msg ${m.from}`}>{m.text}</div>)}
            {typing && <div className="msg bot" aria-label={t.typing}><span className="typing-dot"/> <span className="typing-dot"/> <span className="typing-dot"/></div>}
          </div>
          <div style={{padding:'8px 14px 0',display:'flex',gap:6,flexWrap:'wrap'}}>
            {t.suggestions.map(s => (
              <button key={s} className="chip" style={{fontSize:11,padding:'5px 10px'}} onClick={()=>send(s)}>{s}</button>
            ))}
          </div>
          <div style={{padding:14,display:'flex',gap:8}}>
            <label htmlFor="chat-input" style={{position:'absolute',width:1,height:1,overflow:'hidden',clip:'rect(0 0 0 0)'}}>{t.chatPlaceholder}</label>
            <input id="chat-input" ref={inputRef} className="input" style={{padding:'9px 12px',fontSize:13.5}} placeholder={t.chatPlaceholder} value={draft} onChange={e=>setDraft(e.target.value)} onKeyDown={e=>e.key==='Enter'&&send(draft)}/>
            <button className="btn btn-primary icon-btn" style={{width:38,height:38,borderRadius:10,flexShrink:0}} onClick={()=>send(draft)} aria-label={t.send}><SendIcon size={15}/></button>
          </div>
        </div>
      )}
    </>
  );
}

  const QUIZ = [
    { key:'genres', multi:true, q:t.quizGenresQ, options: CATEGORY_IDS.map(id=>({id,label:CATEGORY_LABELS[lang][id]})) },
    { key:'era', multi:false, q:t.quizEraQ, options: ERA_IDS.map(id=>({id,label:t.eraOptions[id]})) },
    { key:'pace', multi:false, q:t.quizPaceQ, options: PACE_IDS.map(id=>({id,label:t.paceOptions[id]})) },
  ];
  const q = QUIZ[step];
  const value = answers[q.key];
  const toggle = (id) => {
    if (q.multi) { const arr = value || []; setAnswers({...answers,[q.key]: arr.includes(id)?arr.filter(o=>o!==id):[...arr,id]}); }
    else { setAnswers({...answers,[q.key]:id}); }
  };
  const isChecked = (id) => q.multi ? (value||[]).includes(id) : value===id;
  const canNext = q.multi ? (value||[]).length>0 : !!value;
  return (
    <div className="fadein" style={{minHeight:'100vh',display:'flex',alignItems:'center',justifyContent:'center',padding:24,position:'relative',overflow:'hidden'}}>
      <BgMotif style={{width:440,height:220,top:'8%',left:'50%',transform:'translateX(-50%)'}}/>
      <div style={{width:'100%',maxWidth:440,position:'relative'}}>
        <div className="progress-track" style={{marginBottom:28}} role="progressbar" aria-valuenow={step+1} aria-valuemin="1" aria-valuemax={QUIZ.length}><div className="progress-fill" style={{width:`${((step+1)/QUIZ.length)*100}%`}}/></div>
        <p className="muted" style={{fontSize:13,marginBottom:6}}>{t.questionCounter(step+1,QUIZ.length)}</p>
        <h2 className="serif" style={{fontSize:22,marginBottom:20,lineHeight:1.3}}>{q.q}</h2>
        <div role="group" aria-label={q.q} style={{display:'flex',flexDirection:'column',gap:8,marginBottom:24}}>
          {q.options.map(opt=>(
            <div key={opt.id} role="checkbox" aria-checked={isChecked(opt.id)} tabIndex="0" className={`checkbox-row ${isChecked(opt.id)?'checked':''}`} onClick={()=>toggle(opt.id)} onKeyDown={e=>e.key==='Enter'&&toggle(opt.id)}>
              <div className="box">{isChecked(opt.id) && <CheckIcon size={13} color="var(--apricot-ink)"/>}</div>
              <span style={{fontSize:14}}>{opt.label}</span>
            </div>
          ))}
        </div>
        <button className="btn btn-primary" style={{width:'100%',padding:12,borderRadius:10,fontSize:15}} disabled={!canNext} onClick={()=>step<QUIZ.length-1?setStep(step+1):onDone()}>
          {step<QUIZ.length-1?t.next:t.finish}
        </button>
      </div>
    </div>
  );
}

  );
}

function BookDetailView({ book, lang, t, setView, addToCart, cart }) {
  const [days,setDays] = useState(7);
  const [comment,setComment] = useState('');
  const [localReviews,setLocalReviews] = useState(reviewsFor(book.id));
  const [rented,setRented] = useState(false);
  const inCart = cart.some(c=>c.id===book.id);
  const total = days*book.dailyPrice;
  const submitReview = () => { if(!comment.trim())return; setLocalReviews([{n:t.you,t:comment.trim()},...localReviews]); setComment(''); };
  return (
    <div className="fadein" style={{maxWidth:760,margin:'0 auto',padding:24}}>
      <button className="btn" style={{background:'none',display:'flex',alignItems:'center',gap:6,marginBottom:20,color:'inherit'}} onClick={()=>setView('home')}><ChevronLeft size={18}/> {t.back}</button>
      <div style={{display:'flex',gap:24,marginBottom:28,flexWrap:'wrap'}}>
        <div style={{width:180,flexShrink:0}}><BookCover book={book} lang={lang} h={240}/></div>
        <div style={{flex:1,minWidth:220}}>
          <span className="chip moss-bg moss-text" style={{border:'none',marginBottom:10,display:'inline-block'}}>{CATEGORY_LABELS[lang][book.categoryId]}</span>
          <h1 className="serif" style={{fontSize:26,lineHeight:1.25,marginBottom:6,textWrap:'balance'}}>{book.title[lang]}</h1>
          <p className="muted" style={{marginBottom:12}}>{book.author[lang]}</p>
          <div style={{marginBottom:14}}><Stars rating={book.rating} size={16}/> <span className="muted" style={{fontSize:13}}>({t.reviewCount(book.reviewCount)})</span></div>
          <p style={{fontSize:14,lineHeight:1.6,marginBottom:20}}>{book.desc[lang]}</p>
          <div className="card" style={{padding:16}}>
            <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',marginBottom:14}}>
              <span id="days-label" style={{fontSize:14}}>{t.days}</span>
              <div style={{display:'flex',alignItems:'center',gap:12}}>
                <button className="icon-btn btn-ghost" style={{width:30,height:30,borderRadius:8}} onClick={()=>setDays(Math.max(1,days-1))} aria-label={t.decreaseDays}><MinusIcon size={14}/></button>
                <span style={{fontWeight:700,width:20,textAlign:'center'}} aria-live="polite" aria-labelledby="days-label">{days}</span>
                <button className="icon-btn btn-ghost" style={{width:30,height:30,borderRadius:8}} onClick={()=>setDays(days+1)} aria-label={t.increaseDays}><PlusIcon size={14}/></button>
              </div>
            </div>
            <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',marginBottom:16}}>
              <span className="muted" style={{fontSize:13}}>{book.dailyPrice}֏ × {days}</span>
              <span className="apricot" style={{fontSize:20,fontWeight:700}}>{total}֏</span>
            </div>
            <div style={{display:'flex',gap:10}}>
              <button className="btn btn-ghost" style={{flex:1,padding:11,borderRadius:10,fontSize:14,display:'flex',alignItems:'center',justifyContent:'center',gap:6}} onClick={()=>addToCart(book.id, days)}>
                {inCart ? <CheckIcon size={15}/> : <ShoppingCart size={15}/>} {inCart ? t.inCart : t.addToCart}
              </button>
              <button className="btn btn-primary" style={{flex:1,padding:11,borderRadius:10,fontSize:14}} onClick={()=>setRented(true)}>{t.rentNow}</button>
            </div>
            {rented && <p className="toast apricot" role="status" style={{marginTop:12,fontSize:13,textAlign:'center'}}>{t.rentedSuccess(days)}</p>}
          </div>
        </div>
      </div>
      <div style={{borderTop:'1px solid var(--divider)',paddingTop:24}}>
        <h3 className="serif" style={{fontSize:18,marginBottom:14}}>{t.reviews}</h3>
        <div style={{display:'flex',gap:8,marginBottom:18}}>
          <label htmlFor="review-input" style={{position:'absolute',width:1,height:1,overflow:'hidden',clip:'rect(0 0 0 0)'}}>{t.reviewLabel}</label>
          <input id="review-input" className="input" placeholder={t.reviewPlaceholder} value={comment} onChange={e=>setComment(e.target.value)} onKeyDown={e=>e.key==='Enter'&&submitReview()}/>
          <button className="btn btn-primary" style={{padding:'0 18px',borderRadius:10,fontSize:14}} onClick={submitReview}>{t.send}</button>
        </div>
        <div style={{display:'flex',flexDirection:'column',gap:12}}>
          {localReviews.map((r,i)=>(<div key={i} className="card" style={{padding:14}}><div style={{fontWeight:600,fontSize:13,marginBottom:4}}>{r.n}</div><div style={{fontSize:14,lineHeight:1.5}}>{r.t}</div></div>))}
        </div>
      </div>
    </div>
  );
}

/* ---------------- APP ---------------- */
function App() {
  const [view,setView] = useState('login');
  const [lang,setLang] = useState('hy');
  const [theme,setTheme] = useState('dark');
  const [quizAnswers,setQuizAnswers] = useState({});
  const [avatar,setAvatar] = useState('owl');
  const [profile,setProfile] = useState({firstName:'',lastName:'',phone:'',email:'',country:'',address:'',notifications:true});
  const [search,setSearch] = useState('');
  const [activeCategory,setActiveCategory] = useState('all');
  const [selectedBookId,setSelectedBookId] = useState(null);
  const [cart,setCart] = useState([]);
  const t = T[lang];
  const addToCart = (id, days) => setCart(c => c.some(x=>x.id===id) ? c : [...c, {id, days}]);
  const removeFromCart = (id) => setCart(c => c.filter(x=>x.id!==id));
  const clearCart = () => setCart([]);
  const openBook = (id) => { setSelectedBookId(id); setView('detail'); };
  const finishSignup = (form) => { setProfile(p=>({...p,...form})); setView('quiz'); };
  const selectedBook = BOOKS.find(b=>b.id===selectedBookId);
  return (
    <div className={`daran theme-${theme}`}>
      {view==='login' && <LoginView onSubmit={()=>setView('home')} onSignup={()=>setView('signup')} t={t}/>}
      {view==='signup' && <SignupView onDone={finishSignup} onBack={()=>setView('login')} t={t}/>}
      {view==='quiz' && <QuizView answers={quizAnswers} setAnswers={setQuizAnswers} onDone={()=>setView('home')} t={t}/>}
      {(view==='home'||view==='profile'||view==='detail'||view==='cart') && (
        <>
          <Header setView={setView} cartCount={cart.length} selectedAvatar={avatar} lang={lang} setLang={setLang} theme={theme} setTheme={setTheme} t={t}/>
          {view==='home' && <HomeView search={search} setSearch={setSearch} activeCategory={activeCategory} setActiveCategory={setActiveCategory} quizAnswers={quizAnswers} openBook={openBook} lang={lang} t={t}/>}
          {view==='profile' && <ProfileView profile={profile} setProfile={setProfile} avatar={avatar} setAvatar={setAvatar} setView={setView} t={t}/>}
          {view==='detail' && selectedBook && <BookDetailView book={selectedBook} lang={lang} t={t} setView={setView} addToCart={addToCart} cart={cart}/>}
          {view==='cart' && <CartView cart={cart} books={BOOKS} lang={lang} t={t} setView={setView} removeFromCart={removeFromCart} clearCart={clearCart}/>}
        </>
      )}
      <ChatWidget lang={lang} t={t}/>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
